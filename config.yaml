# feed-engine config. Copy to config.local.yaml for machine-specific overrides.

list_urls:
  # Timelines to harvest: the home feed, or any X List URL. Add as many as you
  # like; one is picked at random per run (or all of them, in order, if
  # rotate_lists is false).
  #
  # The home feed is algorithmic and carries ads — promoted posts are detected
  # and dropped before any model call. A List is quieter and higher signal, so
  # move to one when you have a good list built.
  - "https://x.com/home"

rotate_lists: true          # true = random timeline per run, false = walk every one in order

session:
  max_minutes: 13           # hard stop on wall-clock scrolling time
  max_posts: 50             # hard stop on posts collected
  scroll_min_ms: 2000       # randomized pause between scrolls (jitter floor)
  scroll_max_ms: 8000       # jitter ceiling
  scroll_px_min: 500        # randomized scroll distance
  scroll_px_max: 1400
  idle_scrolls_before_stop: 6 # consecutive scrolls yielding no new posts -> stop
  start_jitter_max_sec: 420 # random delay before starting, so cron runs aren't identical

browser:
  profile_dir: "~/.feed-engine/chrome-profile" # persistent logged-in profile; log the alt account in ONCE by hand
  channel: "chrome"         # chrome | msedge | "" for bundled chromium
  headless: false           # run headed, per design
  # Runs headed, so the window must fit the physical screen. Chrome's title bar,
  # tab strip and omnibox eat roughly 110px above the viewport: keep
  # viewport_height at least that far under your desktop working area, or the
  # bottom of the page (sign-in button, post text) renders off-screen.
  # This laptop: 1920x1080 at 125% scaling = 1536x864 logical, 816 usable.
  viewport_width: 1280
  viewport_height: 700
  nav_timeout_ms: 45000

paths:
  db: "./data/ideas.db"
  posts_json: "./data/posts.json"
  seen_ids: "./data/seen_ids.json"
  screenshots: "./data/shots"
  log: "./data/run.log"

prefilter:
  min_words: 10             # drop anything shorter
  visual_max_words: 15      # media + text under this -> screenshot it
  seen_retention_days: 90   # prune the seen-id store past this
  own_handle: "yashx_404"   # never harvest your own posts: the bank must not be
                            # fed its own output. Leave empty to disable.

claude:
  bin: "claude"
  text_prompt: "./prompts/filter_and_seed.md"
  visual_prompt: "./prompts/filter_and_seed_visual.md"
  text_batch_size: 25       # posts per text call
  visual_batch_size: 4      # screenshots per vision call
  timeout_sec: 300
  extra_args: []                          # e.g. ["--model","sonnet"]
  visual_extra_args: ["--allowedTools","Read"] # vision call needs Read to open the PNGs

bank:
  # Pushing harvested seeds to the Feed Runner backend. This is the ONLY
  # outbound write the engine makes, and it writes into a live personal
  # account, so it stays off until you turn it on.
  #
  # The token is a session token from the app ("fr_" + 64 hex). Do NOT put it
  # here: this file is committed. Put it in config.local.yaml (gitignored) as
  #     bank:
  #       token: "fr_..."
  # or leave it empty and export FEED_ENGINE_BANK_TOKEN, which leaves no copy
  # on disk at all. The env var wins over both files.
  enabled: false
  base_url: "https://feed-runner-backend.onrender.com"
  token: ""
  timeout_sec: 60           # generous: the free tier cold-boots in ~30s
  max_per_run: 50           # bounds a backlog flush after days of being off

login:
  # X credentials, used only when the persistent profile has been signed out.
  # Same rule as the token: never here, always config.local.yaml or the env
  # (FEED_ENGINE_X_USERNAME / FEED_ENGINE_X_PASSWORD).
  #
  # auto_login lets an unattended scheduled run sign itself back in. It is off
  # by default on purpose: typing credentials is the single most likely thing
  # here to trip X's automation checks, and the cost of tripping it is the
  # account rather than the run. `-login` (signing in by hand, once) is the
  # safer path and the one to prefer.
  username: ""
  password: ""
  auto_login: false

dedupe:
  recent_seeds: 200         # compare new seeds against this many recent rows
  theme_overlap: 0.6        # jaccard on theme_tags at/above this -> treat as duplicate
  category_cap: 4           # max seeds per category PER RUN. The prompt caps each
                            # model call, but a run makes several (text batches +
                            # vision), so the spread has to be enforced here too.
                            # 0 disables.
